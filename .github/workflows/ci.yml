name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: test_logbook_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test_logbook_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_SOCKET: ''
      XDEBUG_MODE: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, mbstring, intl, zip, bcmath
          coverage: none

      - working-directory: appv3/backend
        run: composer validate --strict

      - working-directory: appv3/backend
        run: composer install --prefer-dist --no-progress --no-interaction

      - working-directory: appv3/backend
        run: ./vendor/bin/pint --test

      - working-directory: appv3/backend
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      - working-directory: appv3/backend
        shell: bash
        # Failing tests are repeated as an annotation, which the run page shows without signing in.
        run: |
          php artisan test --without-tty --no-ansi 2>&1 | tee test-output.txt || {
            echo "::error title=php artisan test::$(grep -A3 -E 'FAILED|Tests:' test-output.txt | cut -c1-180 | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: appv3/frontend/package-lock.json

      - working-directory: appv3/frontend
        run: npm ci

      - working-directory: appv3/frontend
        run: npm run openapi:drift

      - working-directory: appv3/frontend
        run: npm run lint

      - working-directory: appv3/frontend
        run: npm run build

      - working-directory: appv3/frontend
        run: npm run bundle:check

      - working-directory: appv3/frontend
        run: npx vitest run

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose -f appv3/compose.yaml config > /dev/null

      - name: nginx is only published on localhost (Caddy fronts it on the VPS)
        run: |
          docker compose -f appv3/compose.yaml config | grep -q 'host_ip: 127.0.0.1'
