# Single-origin SPA + API: static files (with SPA fallback) are served
# directly; versioned API and Sanctum CSRF routes execute in php-fpm.
upstream php {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API + Sanctum CSRF execute the Laravel front controller in php-fpm.
    # The file only needs to exist in the app container: nginx passes the
    # script path through FastCGI, so no backend code is copied here.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass php;
    }

    location = /sanctum/csrf-cookie {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass php;
    }

    # Laravel liveness probe (optional).
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_pass php;
    }

    # SPA: static assets directly, everything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
