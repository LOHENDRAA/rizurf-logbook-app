name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run openapi:drift
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run bundle:check
      - working-directory: frontend
        run: npx vitest run
